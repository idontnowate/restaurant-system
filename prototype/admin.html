<!doctype html>
<html lang="ar" dir="rtl" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المطعم</title>
<script>
  // تطبيق المظهر قبل رسم الصفحة حتى لا يومض المظهر الافتراضي
  try{var p=JSON.parse(localStorage.getItem('rms-prefs')||'{}');document.documentElement.dataset.theme=p.theme||'aurora'}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#070912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المطعم">
<script src="pwa.js" defer></script>
<style>
/* ================= تخطيط لوحة الإدارة ================= */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side,.set-nav,.ticket{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.side{margin:12px;padding:18px 12px;position:sticky;top:12px;height:calc(100vh - 24px);overflow:auto;border-radius:24px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-size:22px;box-shadow:var(--shine),var(--grad-shadow);flex:none;overflow:hidden}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted)}
.nav{flex:1}
.nav button,.side-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:12px;text-align:start;font-weight:600;color:var(--muted);text-decoration:none}
.nav button:hover,.side-link:hover{background:var(--surface-2);color:var(--text)}
.nav button.active{background:var(--hl);color:var(--hl-text);box-shadow:var(--hl-shadow)}
.nav .ico{width:24px;text-align:center;font-size:18px}
.nav .count{margin-inline-start:auto;background:var(--grad);color:var(--on-grad);border-radius:99px;font-size:12px;padding:0 8px;min-width:22px;text-align:center}
.nav .sep{font-size:12px;color:var(--muted);padding:14px 12px 4px}
.me{border-top:1px solid var(--line);margin-top:10px;padding:12px 6px 0}
.me select{width:100%;margin-top:6px}
.me .row{justify-content:space-between}

.main{padding:20px 24px 40px 12px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}
.top .sub{color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.top .menu-btn{display:none}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--amber);background:var(--amber-soft);color:var(--text);border-radius:16px;padding:10px 14px;margin-bottom:16px;font-weight:600}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:2fr 1fr}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
.search{min-width:180px;flex:1;max-width:340px}

/* بطاقات الأرقام: لكل بطاقة لون إضاءة (في الزجاجي الملوّن) */
.kpi{--glow:34,211,238;position:relative;background:radial-gradient(90% 80% at 100% 0%,rgba(var(--glow),var(--glow-a)),transparent 65%),var(--surface)}
.kpi:nth-child(4n+2){--glow:52,211,153}.kpi:nth-child(4n+3){--glow:167,139,250}.kpi:nth-child(4n+4){--glow:244,114,182}
.kpi::after{content:"";position:absolute;top:16px;inset-inline-end:16px;width:8px;height:8px;border-radius:50%;background:rgb(var(--glow));box-shadow:0 0 12px rgb(var(--glow));opacity:var(--dot)}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .val{font-size:24px;font-weight:800;margin-top:4px;text-shadow:0 0 22px rgba(var(--glow),var(--val-glow))}
.kpi .hint{font-size:12px;color:var(--green)}
.kpi .hint.down{color:var(--red)}

.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:34px;background:var(--chart);border-radius:6px 6px 2px 2px;min-height:2px}
.bar span{font-size:11px;color:var(--muted)}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0}
.hbar .name{width:120px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track,.progress{flex:1;background:var(--surface-2);border-radius:99px;height:10px;overflow:hidden}
.hbar .fill{height:100%;background:var(--chart);border-radius:99px}
.hbar .num{font-size:13px;color:var(--muted);min-width:80px;text-align:end}
.progress{height:8px;min-width:80px}
.progress i{display:block;height:100%;border-radius:99px}

/* نقطة البيع */
.pos{display:grid;grid-template-columns:1fr 370px;gap:16px;align-items:start}
.cart{position:sticky;top:20px}
.lines{max-height:280px;overflow:auto;margin:8px 0}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .info{flex:1;min-width:0}.line .info b{display:block;font-size:14px}
.line .note{font-size:12px;color:var(--red)}
.nbtn{border:0;background:none;font-size:15px;padding:2px 4px;opacity:.75}
.nbtn:hover{opacity:1}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum.total{font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.pay button{padding:12px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.22);font-weight:800;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 60%)}
.cust-fields{display:grid;gap:6px;margin-top:8px}
.cust-fields input,.cust-fields select{width:100%}

/* المطبخ */
.kds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col h3{display:flex;align-items:center;gap:8px}
.ticket{border-top:3px solid var(--blue);border-radius:18px;padding:12px;margin-bottom:12px}
.ticket.late{border-top-color:var(--red)}
.ticket.warn{border-top-color:var(--amber)}
.ticket header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ticket .who{font-size:12px;color:var(--muted);margin-bottom:6px}
.ticket ul{margin:0 0 10px;padding:0;list-style:none}
.ticket li{padding:3px 0;font-weight:600}
.ticket li small{display:block;color:var(--red);font-weight:600}
.timer{font-weight:800;font-variant-numeric:tabular-nums}

/* الطوابق والأقسام */
.section{margin-bottom:16px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-head h3{margin:0}
.section-head input{font-weight:700}
.tbl .del{position:absolute;top:6px;inset-inline-start:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--red-soft);color:var(--red);font-weight:800}
.tbl.add{border-style:dashed;background:none;box-shadow:none;color:var(--muted);display:grid;place-items:center;min-height:120px}
.tbl .acts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.tbl .due{font-weight:800;color:var(--amber);font-size:13px}
.edit-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px}
.edit-bar input{font-weight:700}
.thumb{width:44px;height:34px;border-radius:8px;object-fit:cover;display:block}

/* الحوار العام */
#dlg{width:min(560px,calc(100vw - 24px))}
#dlg.wide{width:min(760px,calc(100vw - 24px))}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h2{margin:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg-foot .spacer{flex:1}
.bill-lines{max-height:42vh;overflow:auto;margin:8px 0}
.recipe-row{display:grid;grid-template-columns:1fr 100px 60px 36px;gap:6px;align-items:center;margin-bottom:6px}
.recipe-row span{font-size:13px;color:var(--muted)}
.tbl-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.tbl-pick button{padding:12px 6px;border-radius:14px;border:1px solid var(--green);background:var(--surface-2);font-weight:800}

/* الإعدادات */
.set-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.set-nav{border-radius:22px;padding:10px;position:sticky;top:20px}
.set-nav .lbl{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.set-nav .lbl:first-child{padding-top:2px}
.set-nav button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:12px;text-align:start;font-weight:600;color:var(--muted);white-space:nowrap}
.set-nav button:hover{background:var(--surface-2);color:var(--text)}
.set-nav button.active{background:var(--hl);color:var(--hl-text);box-shadow:var(--hl-shadow)}
.set-nav button.dz{color:var(--red)}
.set-head h2{margin:0;font-size:19px}
.set-head p{margin:4px 0 18px;color:var(--muted);font-size:13px}
.sub-title{font-weight:800;font-size:14px;color:var(--muted);margin:22px 0 4px}
.set-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-toggle:last-child{border-bottom:0}
.set-toggle strong{display:block;font-size:14px}
.hint{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.set-split{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.theme-card{border:2px solid var(--border);border-radius:20px;padding:8px;background:var(--surface-2);text-align:start}
.theme-card:hover{border-color:rgba(var(--ring),.5)}
.theme-card.sel{border-color:rgb(var(--ring));box-shadow:0 0 0 4px rgba(var(--ring),.18)}
.theme-card .pv{height:96px;border-radius:14px;padding:10px;display:grid;grid-template-columns:28px 1fr;gap:6px;overflow:hidden}
.pv .s,.pv .c{border-radius:8px;border:1px solid rgba(127,127,127,.25)}
.pv .s{grid-row:span 2}
.pv .b{height:8px;border-radius:99px;margin:6px}
.theme-card .nm{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 2px;font-weight:700}
.theme-card .d{padding:0 4px 4px;font-size:12px;color:var(--muted)}
.receipt{background:#fff;color:#111;font-family:Tahoma,monospace;font-size:12px;padding:14px 12px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);direction:rtl}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between}
.receipt img{max-width:60px;max-height:44px}
.zone-row{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin-bottom:8px}
.danger-box{border:1px solid var(--red);background:var(--red-soft);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:start}
.perm .grp td{background:var(--surface-2);font-weight:800;color:var(--muted);font-size:13px}
.perm .sw{margin:auto}
.logo-pv{width:64px;height:64px;border-radius:16px;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;font-size:32px;overflow:hidden;flex:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.pos{grid-template-columns:1fr}.cart{position:static}.set-split{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;margin:0;top:0;height:100vh;inset-inline-start:0;width:270px;border-radius:0;z-index:40;transform:translateX(110%);transition:transform .2s;background:var(--strong);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
  .side.open{transform:none}
  .top .menu-btn{display:grid}
  .main{padding:16px}
  .kds{grid-template-columns:1fr}
  .set-layout{grid-template-columns:1fr}
  .set-nav{position:static;display:flex;overflow-x:auto;gap:6px;background:none;border:0;box-shadow:none;padding:0 0 4px}
  .set-nav .lbl{display:none}
  .set-nav button{width:auto;border:1px solid var(--btn-edge);background:var(--btn-bg);border-radius:999px}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}.kpi .val{font-size:19px}.zone-row{grid-template-columns:1fr 100px auto}.recipe-row{grid-template-columns:1fr 80px 36px}.recipe-row span{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo" id="brandLogo">🍽</div><div><b id="brandName"></b><small id="brandBranch"></small></div></div>
    <nav class="nav" id="nav"></nav>
    <a class="side-link" href="waiter.html" target="_blank"><span class="ico">📱</span>تطبيق الويتر</a>
    <a class="side-link" href="connect.html" target="_blank"><span class="ico">🔗</span>ربط الموبايلات (QR)</a>
    <div class="me" id="me"></div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="btn icon-btn menu-btn" onclick="$('#side').classList.toggle('open')">☰</button>
      <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <span class="net"><i></i> متصل</span>
      <span class="muted" id="clock"></span>
      <button class="btn icon-btn" onclick="quickTheme(event)" title="تبديل بين الفاتح والداكن">🌓</button>
    </div>
    <div id="banner"></div>
    <div id="view"><div class="empty">جاري التحميل…</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden onchange="importData(this)">
<dialog id="dlg"></dialog>

<script src="core.js"></script>
<script>
const ui={page:'dash',cat:'الكل',q:'',cart:[],type:'صالة',table:'',discount:0,zone:0,cust:{name:'',phone:'',address:''},
  set:'info',floor:null,editT:false,editCats:false,range:'today',rfrom:'',rto:'',ostatus:'all',oq:'',cq:'',exMonth:0};

/* ============ المستخدم الحالي والصلاحيات ============ */
const ME=()=>{
  if(MODE==='cloud') return {...SESSION.user,on:true};
  return S.staff.find(p=>p.id===P.user)||S.staff.find(p=>p.role==='مدير')||S.staff[0]||{id:0,name:'المدير',role:'مدير'};
};
const canI=k=>can(ME().role,k);
const isMgr=()=>ME().role==='مدير';
const H='<span class="muted">•••</span>';

/* ============ التنقل ============ */
const PAGES=[
  {id:'dash',ico:'📊',t:'لوحة التحكم',s:'نظرة سريعة على أداء اليوم'},
  {id:'pos',ico:'🧾',t:'نقطة البيع',s:'تسجيل طلب جديد'},
  {id:'kds',ico:'👨‍🍳',t:'شاشة المطبخ',s:'الطلبات الجارية — تصل مباشرة من الكاشير والويتر'},
  {id:'tables',ico:'🪑',t:'الطاولات',s:'الطوابق والأقسام والحسابات والحجوزات'},
  {id:'orders',ico:'📋',t:'الطلبات',s:'سجل الطلبات والفواتير'},
  {sep:'الإدارة'},
  {id:'menu',ico:'🍔',t:'المنيو',s:'الأصناف والصور والأسعار والوصفات'},
  {id:'inv',ico:'📦',t:'المخزون',s:'المواد الخام والاستلام والهدر'},
  {id:'cust',ico:'⭐',t:'العملاء',s:'الزبائن ونقاط الولاء'},
  {id:'cash',ico:'💰',t:'الصندوق',s:'الوردية الحالية وإغلاقها (تقرير Z)'},
  {id:'expenses',ico:'💸',t:'المصاريف',s:'الإيجار والرواتب والكهرباء وغيرها'},
  {id:'reports',ico:'📈',t:'التقارير',s:'المبيعات والأرباح حسب الفترة'},
  {id:'staff',ico:'👥',t:'الموظفين',s:'حسابات الموظفين وأدوارهم'},
  {id:'log',ico:'🕓',t:'سجل العمليات',s:'من فعل ماذا ومتى'},
  {id:'settings',ico:'⚙️',t:'الإعدادات',s:'إعدادات المطعم وحسابك وهذا الجهاز'},
];
function go(p){ui.page=p;$('#side').classList.remove('open');render();scrollTo(0,0)}
function renderNav(){
  const active=S.orders.filter(o=>o.status!=='done'&&o.status!=='void').length, low=lowItems().length, due=dueTables().length;
  let sep='';
  $('#nav').innerHTML=PAGES.map(p=>{
    if(p.sep){sep=`<div class="sep">${p.sep}</div>`;return ''}
    if(!canI(p.id)) return '';
    const h=sep; sep='';
    const c=p.id==='kds'?active:p.id==='inv'?low:p.id==='tables'?due:0;
    return h+`<button class="${ui.page===p.id?'active':''}" onclick="go('${p.id}')"><span class="ico">${p.ico}</span>${p.t}${c?`<span class="count">${num(c)}</span>`:''}</button>`}).join('');
  const me=ME();
  $('#me').innerHTML=MODE==='cloud'
    ?`<div class="row"><b style="font-size:14px">👤 ${esc(me.name)}</b><span class="badge b-blue">${me.role}</span></div>
      <div class="muted ltr" style="font-size:12px;text-align:end">${esc(me.username||'')}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm" onclick="ui.set='account';go('settings')">🔑 حسابي</button><button class="btn sm" onclick="if(confirm('تسجيل الخروج؟'))logout()">خروج ⎋</button></div>`
    :`<div class="row"><span class="muted" style="font-size:12px">المستخدم الحالي</span><span class="badge b-blue">${me.role}</span></div>
      <select onchange="P.user=isNaN(+this.value)?this.value:+this.value;savePrefs();render()">${S.staff.map(p=>`<option value="${esc(p.id)}" ${p.id===me.id?'selected':''}>${esc(p.name)} — ${p.role}</option>`).join('')}</select>
      <div class="muted" style="font-size:11px;margin-top:6px">${MODE==='server'?'خادم المطعم (بدون حسابات)':'وضع التجربة على هذا الجهاز'}</div>`;
}
const lowItems=()=>st().lowAlert?S.inventory.filter(i=>i.qty<=i.min):[];
const enabledTypes=()=>Object.keys(st().types).filter(k=>st().types[k]);
const openOrders=t=>S.orders.filter(o=>o.table===t&&!o.pay&&o.status!=='void');
const dueTables=()=>S.tables.filter(t=>openOrders(t.id).length);
function renderBanner(){
  let h='';
  if(MODE==='cloud'){
    const exp=new Date(SESSION.user.restaurant?.expires_at), days=Math.ceil((exp-Date.now())/864e5);
    if(days<=7) h=`<div class="banner">⏳ ينتهي اشتراك المطعم بعد ${num(Math.max(days,0))} ${days===1?'يوم':'أيام'} (${exp.toLocaleDateString('en-GB')}) — تواصل مع مزوّد البرنامج للتجديد.</div>`;
  }
  $('#banner').innerHTML=h;
}
function render(){
  if(!$('#view')) return;
  if(!canI(ui.page)) ui.page=PAGES.find(p=>p.id&&canI(p.id))?.id||'dash';
  const p=PAGES.find(x=>x.id===ui.page);
  $('#pageTitle').textContent=p.t; $('#pageSub').textContent=p.s;
  $('#brandName').textContent=st().name; $('#brandBranch').textContent=st().branch; $('#brandLogo').innerHTML=logoHtml();
  document.title=st().name+' — '+p.t;
  renderNav(); renderBanner();
  $('#view').innerHTML=canI(ui.page)?VIEWS[ui.page]():'<div class="empty card">لا توجد صفحات مسموحة لحسابك — راجع المدير</div>';
}
// تحديث من جهاز آخر: لا نعيد الرسم أثناء الكتابة في حقل حتى لا يضيع ما يكتبه المستخدم
let pendingRender=false, seenOrders=new Set();
onRemote=()=>{
  const fresh=S.orders.filter(o=>!seenOrders.has(o.uid)&&o.status==='new');
  S.orders.forEach(o=>seenOrders.add(o.uid));
  if(fresh.length){
    if(st().kdsSound&&ui.page==='kds') beep();
    if(P.kdsPrint) fresh.forEach(printTicket);
  }

const RANGES=[['today','اليوم'],['yesterday','أمس'],['7d','7 أيام'],['30d','30 يوماً'],['month','هذا الشهر'],['custom','فترة محددة']];
function rangeOf(k){
  const t=dayStart(), D=864e5;
  if(k==='today') return [t,t+D];
  if(k==='yesterday') return [t-D,t];
  if(k==='7d') return [t-6*D,t+D];
  if(k==='30d') return [t-29*D,t+D];
  if(k==='month'){const d=new Date();return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),t+D]}
  return [ui.rfrom?new Date(ui.rfrom).setHours(0,0,0,0):t, ui.rto?new Date(ui.rto).setHours(0,0,0,0)+D:t+D];
}

let arcCache={};
function ordersIn([from,to]){
  const live=S.orders.filter(o=>o.createdAt>=from&&o.createdAt<to);
  if(MODE!=='cloud'||from>=dayStart()-864e5) return live;
  const k=from+'|'+to, c=arcCache[k];
  if(!c){arcCache[k]='loading';
    rpc('rms_orders_range',{p_token:TOKEN(),p_from:new Date(from).toISOString(),p_to:new Date(to).toISOString()})
      .then(a=>{arcCache[k]=a;render()}).catch(e=>{arcCache[k]=[];toast('⚠ '+errText(e))});
    return null}
  if(c==='loading') return null;
  const seen=new Set(live.map(o=>o.uid));
  return live.concat(c.filter(o=>!seen.has(o.uid)));
}

   ${cost?`<td class="muted">${c?fmt(c):'—'}</td><td>${c?`<span class="badge ${pct>35?'b-red':pct>28?'b-amber':'b-green'}">${num(pct)}%</span>`:'<span class="muted">لا توجد وصفة</span>'}</td>`:''}

},

inv(){

  <div class="card table-wrap"><table><tr><th>المادة</th><th>الكمية</th><th>المستوى</th><th>الحد الأدنى</th>${cost?'<th>سعر الوحدة</th><th>القيمة</th>':''}<th>الحالة</th><th></th></tr>
  ${S.inventory.map(i=>{const lvl=Math.min(100,i.qty/((i.min||1)*2.5)*100),low=i.qty<=i.min,warn=i.qty<=i.min*1.5;

     ${ed?` <button class="nbtn" title="تعديل" onclick="openMaterial('${i.id}')">✏️</button>`:''}</td></tr>`}).join('')||`<tr><td colspan="8" class="empty">لا توجد مواد${ed?' — أضف المواد الخام ثم اربطها بوصفات الأصناف':''}</td></tr>`}</table>
  <p class="muted" style="font-size:13px;margin:12px 0 0">💡 ${st().autoDeduct?'يتم خصم المواد تلقائياً عند كل بيع حسب وصفة الصنف (وتُرجع عند إلغاء الطلب).':'الخصم التلقائي متوقف من الإعدادات.'}</p></div>

      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeShift()">🔒 إغلاق الوردية وطباعة تقرير Z</button><button class="btn" onclick="printHtml(zReportHtml(shiftData()))">🖨️ تقرير X (بدون إغلاق)</button></div>

expenses(){
  const d=new Date(), m=new Date(d.getFullYear(),d.getMonth()-ui.exMonth,1), m2=new Date(m.getFullYear(),m.getMonth()+1,1);
  const list=S.expenses.filter(e=>e.at>=m&&e.at<m2).sort((a,b)=>b.at-a.at), tot=list.reduce((s,e)=>s+e.amount,0);
  const byCat={}; list.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
  const mx=Math.max(...Object.values(byCat),1);
  return `<div class="toolbar"><button class="btn primary" onclick="openExpense()">＋ مصروف جديد</button><span class="spacer"></span>
    <button class="btn icon-btn" onclick="ui.exMonth++;render()">→</button><b>${m.toLocaleDateString('ar-IQ-u-nu-latn',{month:'long',year:'numeric'})}</b>
    <button class="btn icon-btn" ${ui.exMonth?'':'disabled'} onclick="ui.exMonth--;render()">←</button></div>
  <div class="grid two">
    <div class="card table-wrap"><table><tr><th>التاريخ</th><th>البند</th><th>المبلغ</th><th>ملاحظة</th><th>بواسطة</th><th></th></tr>
     ${list.map(e=>`<tr><td>${dateStr(e.at)}</td><td><span class="badge b-gray">${esc(e.cat)}</span>${e.drawer?' <span class="badge b-amber" title="دُفع من درج الكاشير">💵 الدرج</span>':''}</td><td><b>${fmt(e.amount)}</b></td><td class="muted">${esc(e.note||'')}</td><td class="muted">${esc(e.by||'')}</td>

    <div class="card"><h3>المجموع: ${fmt(tot)}</h3>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span class="name">${esc(k)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><span class="num">${fmt(v)}</span></div>`).join('')||'<div class="empty">—</div>'}</div>
  </div>`;

reports(){
  const [from,to]=rangeOf(ui.range), all=ordersIn([from,to]);
  const head=`<div class="toolbar">${rangeBar()}<span class="spacer"></span>${all?`<button class="btn" onclick="exportReport()">⬇ تصدير Excel (CSV)</button>`:''}</div>`;
  if(!all) return head+LOADING;
  const R=report(all,from,to), see=canI('sales'), cost=canI('cost');
  const block=(title,rows,money=true)=>{const mx=Math.max(...rows.map(r=>r[1]),1);return `<div class="card"><h3>${title}</h3>${rows.map(([k,v])=>`<div class="hbar"><span class="name">${esc(k)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><span class="num">${money?(see?fmt(v):'•••'):num(v)}</span></div>`).join('')||'<div class="empty">—</div>'}</div>`};
  const k=(l,v,c='')=>`<div class="card kpi"><div class="label">${l}</div><div class="val" style="${c}">${v}</div></div>`;
  return head+`<div class="grid kpis">
    ${k('صافي المبيعات',see?fmt(R.sales):'•••')}${k('عدد الطلبات',num(R.count))}${k('متوسط الفاتورة',see?fmt(R.avg):'•••')}${k('الخصومات',see?fmt(R.disc):'•••')}
    ${k('تكلفة المواد',cost?fmt(R.mat):'•••')}${k('مجمل الربح',see&&cost?fmt(R.sales-R.mat):'•••','color:var(--green)')}
    ${k('المصاريف + الهدر',cost?fmt(R.exp+R.waste):'•••')}${k('صافي الربح',see&&cost?fmt(R.net):'•••',`color:${R.net<0?'var(--red)':'var(--green)'}`)}
  </div>
  <p class="muted" style="font-size:13px">${R.voids?`ملغية: ${num(R.voids)} طلب بقيمة ${see?fmt(R.voidAmt):'•••'} — غير محسوبة في المبيعات. `:''}${cost&&R.sales?'نسبة تكلفة الطعام: '+(R.mat/R.sales*100).toFixed(1)+'%':''}</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:16px">
    ${block('حسب طريقة الدفع',R.byPay)}${block('حسب نوع الطلب',R.byType)}${block('حسب التصنيف',R.byCat)}
    ${block('حسب الموظف',R.byStaff)}${block('الأصناف الأكثر مبيعاً (كمية)',R.top.slice(0,10).map(t=>[t.name,t.qty]),false)}
    ${block('الأصناف الأعلى إيراداً',R.top.slice().sort((a,b)=>b.rev-a.rev).slice(0,10).map(t=>[t.name,t.rev]))}
    ${block('ساعات الذروة (عدد الطلبات)',R.byHour,false)}
  </div>`;
},

const fInput=(label,key,type='text',extra='')=>`<label>${label}<input type="${type}" value="${esc(st()[key])}" ${type==='number'||type==='tel'?'class="ltr"':''} ${extra} onchange="setS('${key}',this.type==='number'?+this.value:this.value)"></label>`;

const fToggle=(title,hint,key)=>`<div class="set-toggle"><span><strong>${title}</strong>${hint?`<span class="hint">${hint}</span>`:''}</span><button class="sw ${st()[key]?'on':''}" onclick="setS('${key}',!S.settings.${key})"></button></div>`;

/* ============ العمليات ============ */
function setS(k,v){S.settings[k]=v;save();render();toast('✓ تم الحفظ')}
function toggleIn(obj,key){
  const o=S.settings[obj];
  if(o[key]&&Object.values(o).filter(Boolean).length===1) return toast('يجب إبقاء خيار واحد مفعّل على الأقل');
  o[key]=!o[key];save();render();
}
function togglePerm(role,k){
  if(!isMgr()) return toast('تعديل الصلاحيات للمدير فقط');
  S.perms[role]=S.perms[role]||{}; S.perms[role][k]=!S.perms[role][k]; save(); render();
  logAction('تعديل الصلاحيات',`${role}: ${PERM_ROWS.find(r=>r.k===k)?.t} ${S.perms[role][k]?'✓':'✗'}`);
}
function setDiscount(v){
  v=Math.max(0,+v||0);
  if(v>st().maxDiscount){toast(`أعلى خصم مسموح ${num(st().maxDiscount)}% — يحتاج موافقة المدير`);v=st().maxDiscount}
  ui.discount=v;render();
}
function topItems(orders){
  const c={};orders.forEach(o=>o.items.forEach(l=>{const k=lineName(l);c[k]=c[k]||{name:k,qty:0,rev:0};c[k].qty+=l.qty;c[k].rev+=(l.price??item(l.id)?.price??0)*l.qty}));
  return Object.values(c).sort((a,b)=>b.qty-a.qty);
}
const orderByUid=u=>S.orders.find(o=>o.uid===u);
// الطلب قد يكون في البيانات الحالية أو في الأرشيف المحمّل
const findOrder=u=>orderByUid(u)||Object.values(arcCache).filter(Array.isArray).flat().find(o=>o.uid===u);

/* ---- نقطة البيع ---- */
function posItems(){
  const q=ui.q.trim();
  const list=S.menu.filter(m=>(ui.cat==='الكل'||m.cat===ui.cat)&&(!q||m.name.includes(q)));
  return list.map(m=>{const ok=available(m),n=ui.cart.filter(l=>l.id===m.id).reduce((s,l)=>s+l.qty,0);return `<button class="item ${ok?'':'off'}" ${ok?`onclick="addToCart(${m.id})"`:'disabled'}>
     ${n?`<span class="qbadge">${num(n)}</span>`:''}<div class="pic">${pic(m)}</div><div class="nm">${esc(m.name)}</div><div class="pr">${fmt(m.price)}</div></button>`}).join('')
    +(canI('addItem')&&!q?`<button class="item add-tile" onclick="openDish(null,ui.cat)"><b>＋</b><div class="nm">صنف جديد</div></button>`:'')
    +(!list.length&&q?'<div class="empty">لا توجد نتائج</div>':'');
}
const cartOrder=()=>({items:ui.cart,type:ui.type,discount:ui.discount,fee:st().zones[ui.zone]?.fee});
const cartCalc=()=>calc(cartOrder());
function addToCart(id){const m=item(id),l=ui.cart.find(x=>x.id===id&&!x.note);l?l.qty++:ui.cart.push({id,qty:1,price:m.price,name:m.name});render()}
function qty(i,d){ui.cart[i].qty+=d;if(ui.cart[i].qty<=0)ui.cart.splice(i,1);render()}
function lineNote(i){const n=prompt('ملاحظة للمطبخ (بدون بصل، حار…):',ui.cart[i].note||'');if(n!==null){ui.cart[i].note=n.trim();render()}}
function clearCart(){ui.cart=[];ui.discount=0;ui.cust={name:'',phone:'',address:''};render()}
function pickCustomer(phone){
  ui.cust.phone=phone.trim();
  const c=S.customers.find(x=>x.phone===ui.cust.phone);
  if(c){ui.cust.name=c.name;ui.cust.address=c.address||'';toast(`⭐ ${c.name} — ${num(c.points)} نقطة`)}
  render();
}
// قائمة الطاولات مجمّعة حسب الطابق والقسم
function tableOptions(sel){
  return `<option value="">— اختر الطاولة —</option>`+S.floors.map(f=>f.sections.map(s=>{
    const ts=S.tables.filter(t=>t.section===s.id); if(!ts.length) return '';
    return `<optgroup label="${esc(f.name)} › ${esc(s.name)}">${ts.map(t=>`<option value="${t.id}" ${sel==t.id?'selected':''}>طاولة ${t.id} (${t.seats} أشخاص)${t.status==='busy'||t.status==='bill'?' · مفتوحة':t.status==='res'?' · محجوزة':''}</option>`).join('')}</optgroup>`}).join('')).join('');
}
function addCustomerSale(cust,amount){
  if(!cust?.phone) return;
  let c=S.customers.find(x=>x.phone===cust.phone);
  if(!c){c={id:'c'+uid(),name:cust.name||'',phone:cust.phone,address:cust.address||'',orders:0,spent:0,points:0};S.customers.push(c)}
  if(cust.name)c.name=cust.name; if(cust.address)c.address=cust.address;
  c.orders++; c.spent+=amount; c.points+=Math.floor(amount/(st().pointsPer||1000)); c.last=Date.now();
  save();
}
async function checkout(pay){
  if(!ui.cart.length) return toast('السلة فارغة');
  if(ui.type==='صالة'&&st().requireTable&&!ui.table) return toast('اختر الطاولة أولاً');
  if(ui.type==='توصيل'&&!ui.cust.phone) return toast('أدخل هاتف الزبون للتوصيل');
  const now=Date.now(), me=ME().name;
  const o={uid:uid(),type:ui.type,table:ui.type==='صالة'&&ui.table?+ui.table:null,items:ui.cart.map(l=>({...l})),status:'new',pay,discount:ui.discount,by:me,createdAt:now};
  if(pay){o.paidAt=now;o.paidBy=me}
  if(ui.type!=='صالة'&&(ui.cust.phone||ui.cust.name)) o.customer={...ui.cust};
  if(o.type==='توصيل'){
    o.fee=st().zones[ui.zone]?.fee??st().deliveryFee; o.zone=st().zones[ui.zone]?.name;
    if(sub(o)<st().minDelivery) return toast(`أقل مبلغ للتوصيل ${fmt(st().minDelivery)}`);
  }
  try{await action({type:'order',order:o})}catch(e){return toast('⚠ '+errText(e))}
  seenOrders.add(o.uid);
  const saved=orderByUid(o.uid)||o;
  if(pay) addCustomerSale(o.customer,total(saved));
  if(o.discount) logAction('خصم',`طلب #${saved.id}: ${o.discount}%`);

    `<button class="btn" onclick="closeDlg()">إلغاء</button><button class="btn primary" onclick="saveStock('${id}','${kind}')">حفظ</button>`);
  $('#sQty').focus();
}
function saveStock(id,kind){
  const i=S.inventory.find(x=>x.id===id), q=+val('sQty');
  if(!(q>0)) return toast('أدخل الكمية');
  if(kind==='in'){
    const c=+val('sCost'); if(c>0) i.cost=c;
    i.qty=+(i.qty+q).toFixed(3); logAction('استلام بضاعة',`${i.name}: ${dec(q)} ${i.unit}`);
  }else{
    const r=$('#sReason').value; i.qty=Math.max(0,+(i.qty-q).toFixed(3));
    S.waste.unshift({at:Date.now(),id,name:i.name,unit:i.unit,qty:q,reason:r,by:ME().name,cost:q*i.cost}); S.waste.length=Math.min(S.waste.length,1000);
    logAction('هدر',`${i.name}: ${dec(q)} ${i.unit} — ${r}`);
  }
  save(); closeDlg(); render(); toast('✓ تم التحديث');
}

/* ---- الصندوق والوردية ---- */
function shiftData(){
  const start=S.shiftStart||dayStart(), end=Date.now();
  const paid=S.orders.filter(o=>o.pay&&o.status!=='void'&&(o.paidAt||o.createdAt)>=start);
  const byPay={}; paid.forEach(o=>byPay[o.pay]=(byPay[o.pay]||0)+total(o));
  const cashExp=S.expenses.filter(e=>e.drawer&&e.at>=start).reduce((s,e)=>s+e.amount,0);
  const opening=+st().openingCash||0;
  return {start,end,by:ME().name,opening,byPay,cashExp,expected:opening+(byPay['نقدي']||0)-cashExp,
    total:Object.values(byPay).reduce((a,b)=>a+b,0),count:paid.length,
    voids:S.orders.filter(o=>o.status==='void'&&(o.voidAt||o.createdAt)>=start).length,
    unpaid:dueTables().length,disc:paid.reduce((s,o)=>s+calc(o).d,0)};
}
function diffHtml(c){const d=c-shiftData().expected;return isNaN(c)||c===0?'':`<b style="color:${d<0?'var(--red)':'var(--green)'}">${d<0?'عجز':d>0?'زيادة':'مطابق ✓'} ${d?fmt(Math.abs(d)):''}</b>`}
function zReportHtml(z){
  return `<div class="c"><h1>${esc(st().name)}</h1><div class="b">${z.closed?'تقرير Z — إغلاق وردية':'تقرير X — بدون إغلاق'}</div>
    <div>${dateStr(z.start)} ${timeStr(z.start)} ← ${timeStr(z.end)}</div><div>${esc(z.by)}</div></div><hr>
    <div class="r"><span>عدد الطلبات</span><span>${num(z.count)}</span></div>
    ${Object.entries(z.byPay).map(([k,v])=>`<div class="r"><span>${esc(k)}</span><span>${num(v)}</span></div>`).join('')}
    <div class="r b"><span>إجمالي المبيعات</span><span>${fmt(z.total)}</span></div>
    ${z.disc?`<div class="r"><span>الخصومات</span><span>${num(z.disc)}</span></div>`:''}
    ${z.voids?`<div class="r"><span>طلبات ملغية</span><span>${num(z.voids)}</span></div>`:''}<hr>
    <div class="r"><span>النقد الافتتاحي</span><span>${num(z.opening)}</span></div>
    ${z.cashExp?`<div class="r"><span>مصاريف من الدرج</span><span>− ${num(z.cashExp)}</span></div>`:''}
    <div class="r b"><span>النقد المتوقع</span><span>${num(z.expected)}</span></div>
    ${z.counted!=null?`<div class="r"><span>النقد الفعلي</span><span>${num(z.counted)}</span></div><div class="r b"><span>الفرق</span><span>${num(z.diff)}</span></div>`:''}
    <hr><div class="c note">توقيع الكاشير: ............ توقيع المدير: ............</div>`;
}
function closeShift(){
  const raw=$('#counted').value, z=shiftData();
  if(st().closeShift&&raw==='') return toast('أدخل النقد الموجود فعلياً في الدرج أولاً');
  if(z.unpaid&&!confirm(`يوجد ${z.unpaid} طاولات لم تُدفع بعد. إغلاق الوردية على أي حال؟`)) return;
  if(!confirm('إغلاق الوردية الحالية وبدء وردية جديدة؟')) return;
  z.counted=raw===''?null:+raw; z.diff=z.counted==null?null:z.counted-z.expected; z.closed=true; z.end=Date.now();
  S.shifts.unshift(z); S.shifts.length=Math.min(S.shifts.length,400); S.shiftStart=z.end; save();
  logAction('إغلاق وردية',`المبيعات ${num(z.total)}${z.diff!=null?` — الفرق ${num(z.diff)}`:''}`);
  printHtml(zReportHtml(z)); render(); toast('✓ تم إغلاق الوردية');
}

/* ---- التقارير ---- */
function report(all,from,to){
  const ok=all.filter(o=>o.status!=='void'), voids=all.filter(o=>o.status==='void');
  const sales=ok.reduce((s,o)=>s+total(o),0);
  const mat=ok.reduce((s,o)=>s+o.items.reduce((a,l)=>a+(item(l.id)?costOf(item(l.id))*l.qty:0),0),0);
  const exp=S.expenses.filter(e=>e.at>=from&&e.at<to).reduce((s,e)=>s+e.amount,0);
  const waste=S.waste.filter(w=>w.at>=from&&w.at<to).reduce((s,w)=>s+(w.cost||0),0);
  const group=f=>{const g={};ok.forEach(o=>{const k=f(o);g[k]=(g[k]||0)+total(o)});return Object.entries(g).sort((a,b)=>b[1]-a[1])};
  const cats={};ok.forEach(o=>o.items.forEach(l=>{const c=item(l.id)?.cat||'أخرى';cats[c]=(cats[c]||0)+(l.price??item(l.id)?.price??0)*l.qty}));
  const hours={};ok.forEach(o=>{const h=new Date(o.createdAt).getHours();hours[h]=(hours[h]||0)+1});
  return {sales,count:ok.length,avg:ok.length?sales/ok.length:0,disc:ok.reduce((s,o)=>s+calc(o).d,0),mat,exp,waste,net:sales-mat-exp-waste,
    voids:voids.length,voidAmt:voids.reduce((s,o)=>s+calc(o).t,0),
    byPay:group(o=>o.pay||'غير مدفوع'),byType:group(o=>o.type),byStaff:group(o=>o.by||'—'),
    byCat:Object.entries(cats).sort((a,b)=>b[1]-a[1]),top:topItems(ok),
    byHour:Object.entries(hours).sort((a,b)=>a[0]-b[0]).map(([h,n])=>[h+':00',n])};
}
function exportReport(){
  const [from,to]=rangeOf(ui.range), all=ordersIn([from,to])||[];
  const rows=[['رقم الطلب','التاريخ','الوقت','النوع','الطاولة','بواسطة','الزبون','الهاتف','الأصناف','المجموع','الخصم %','الإجمالي','طريقة الدفع','الحالة','سبب الإلغاء']];
  all.slice().sort((a,b)=>a.createdAt-b.createdAt).forEach(o=>rows.push([o.id,new Date(o.createdAt).toLocaleDateString('en-GB'),timeStr(o.createdAt),o.type,o.table||'',o.by||'',o.customer?.name||'',o.customer?.phone||'',
    o.items.map(l=>lineName(l)+' x'+l.qty).join(' | '),sub(o),o.discount||0,o.status==='void'?0:calc(o).t,o.pay||'غير مدفوع',o.status==='void'?'ملغي':'مكتمل',o.voidReason||'']));
  downloadFile(`تقرير-المبيعات-${new Date(from).toISOString().slice(0,10)}.csv`,csv(rows),'text/csv;charset=utf-8');
  toast('✓ تم تنزيل التقرير — يفتح في Excel');
}

/* ---- الموظفون ---- */
function openStaff(id){
  const p=id?S.staff.find(x=>String(x.id)===String(id)):null, cloud=MODE==='cloud';
  openDlg(p?'تعديل موظف':'موظف جديد',`<div class="form">
    <label>الاسم<input type="text" id="uName" value="${esc(p?.name||'')}"></label>
    ${cloud?`<label>اسم المستخدم (للدخول)<input type="text" id="uUser" class="ltr" autocapitalize="none" value="${esc(p?.username||'')}" placeholder="ali.h"></label>
    <label>كلمة المرور${p?' (اتركها فارغة لعدم التغيير)':''}<input type="text" id="uPass" class="ltr" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>`:''}
    <label>الدور<select id="uRole">${ROLES.map(r=>`<option ${p?.role===r?'selected':''}>${r}</option>`).join('')}</select></label>
    <label>الوردية<select id="uShift">${['صباحي','مسائي','ليلي','كامل'].map(s=>`<option ${p?.shift===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label style="flex-direction:row;align-items:center;gap:10px">الحساب فعّال <button type="button" class="sw ${p?.on===false?'':'on'}" id="uOn" onclick="this.classList.toggle('on')"></button></label></div>
    ${cloud?'<p class="muted" style="font-size:12.5px">💡 اسم المستخدم بالإنجليزي والأرقام فقط، وفريد على مستوى البرنامج (مثلاً: ali.diyar). أعطِ الموظف اسم المستخدم وكلمة المرور ليدخل من أي جهاز.</p>':''}`,
    `${p&&p.id!==ME().id?`<button class="btn danger" onclick="delStaff('${p.id}')">حذف</button>`:''}<span class="spacer"></span><button class="btn" onclick="closeDlg()">إلغاء</button><button class="btn primary" id="uSave" onclick="saveStaff(${p?`'${p.id}'`:'null'})">حفظ</button>`);
}
async function saveStaff(id){
  const d={name:val('uName'),role:$('#uRole').value,shift:$('#uShift').value,active:$('#uOn').classList.contains('on')};
  if(!d.name) return toast('أدخل الاسم');
  if(MODE==='cloud'){
    d.username=val('uUser').toLowerCase(); d.password=val('uPass')||null; if(id) d.id=id;
    if(!id&&!d.password) return toast('أدخل كلمة مرور للموظف');
    const b=$('#uSave'); b.disabled=true;
    try{await rpc('rms_staff_save',{p_token:TOKEN(),p_user:d});await loadStaff()}
    catch(e){b.disabled=false;return toast('⚠ '+errText(e))}
    closeDlg(); render(); return toast(id?'✓ تم تعديل الموظف':`✓ تمت الإضافة — اسم المستخدم: ${d.username}`);
  }
  const p=id?S.staff.find(x=>String(x.id)===String(id)):null;
  if(p&&p.id===ME().id&&(d.role!=='مدير'||!d.active)) return toast('لا يمكنك إيقاف حسابك أو تغيير دورك');
  const rec={name:d.name,role:d.role,shift:d.shift,on:d.active};
  if(p) Object.assign(p,rec); else S.staff.push({id:Math.max(0,...S.staff.map(x=>+x.id||0))+1,...rec});
  logAction(p?'تعديل موظف':'إضافة موظف',`${d.name} (${d.role})`); save(); closeDlg(); render();
}
async function delStaff(id){
  const p=S.staff.find(x=>String(x.id)===String(id));
  if(!confirm(`حذف ${p.name} نهائياً؟ (يمكنك بدلاً من ذلك إيقاف حسابه)`)) return;
  if(MODE==='cloud'){try{await rpc('rms_staff_delete',{p_token:TOKEN(),p_id:id});await loadStaff()}catch(e){return toast('⚠ '+errText(e))}}
  else{S.staff=S.staff.filter(x=>String(x.id)!==String(id));logAction('حذف موظف',p.name);save()}
  closeDlg(); render();
}

/* ---- الحساب والإعدادات ---- */
async function changePassword(){
  const o=$('#pwOld').value, n=$('#pwNew').value;
  if(n!==$('#pwNew2').value) return toast('كلمتا المرور غير متطابقتين');
  if(n.length<6) return toast(ERR_TEXT.WEAK_PASSWORD);
  try{const r=await rpc('rms_change_password',{p_token:TOKEN(),p_old:o,p_new:n});if(r.error)throw {code:'LOGIN'}}
  catch(e){return toast('⚠ '+(e.code==='LOGIN'?'كلمة المرور الحالية غير صحيحة':errText(e)))}
  ['pwOld','pwNew','pwNew2'].forEach(i=>$('#'+i).value=''); toast('✓ تم تغيير كلمة المرور');
}

  const f=input.files[0]; input.value=''; if(!f) return;

function importData(input){
  const f=input.files[0]; if(!f) return;
  f.text().then(t=>{
    const d=JSON.parse(t);
    if(!Array.isArray(d.menu)||!Array.isArray(d.orders)) throw 0;
    if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟')) return;
    S=d;migrate();syncStaffIntoState();save();render();logAction('استرجاع نسخة احتياطية','');toast('✓ تم استرجاع النسخة');
  }).catch(()=>toast('الملف غير صالح')).finally(()=>input.value='');
}
function resetAll(){
  if(!confirm('سيتم حذف المنيو والمخزون والطلبات والعملاء والمصاريف نهائياً. متابعة؟')) return;
  if(prompt('للتأكيد اكتب: مسح')!=='مسح') return toast('لم يتم المسح');
  const keep={settings:S.settings,perms:S.perms,floors:S.floors,tables:S.tables.map(t=>({...t,status:'free'})),staff:S.staff};
  S={...BLANK(st().name),...keep}; migrate(); save(); logAction('مسح كل البيانات',''); render(); toast('تم المسح');
}
